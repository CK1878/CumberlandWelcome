<!DOCTYPE html>
<html lang="en-GB" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumbria Local | Independent Cafés, Live Events & Area Hubs</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Modern Display Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet Open-Source Mapping Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #map-container { height: 420px; width: 100%; border-radius: 1rem; z-index: 1; }
        .leaflet-tile { filter: brightness(0.75) invert(1) contrast(1.2) hue-rotate(190deg); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-brand-600 selection:text-white pb-24">

    <!-- NAVIGATION HEADER -->
    <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-9 w-9 bg-gradient-to-tr from-brand-600 via-sky-500 to-emerald-400 rounded-xl flex items-center justify-center font-display font-black text-white text-xl shadow-lg shadow-brand-600/20">
                    C
                </div>
                <div>
                    <span class="font-display font-black tracking-tight text-white text-lg">CUMBRIA<span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-emerald-400">LOCAL</span></span>
                    <span class="hidden sm:inline-block ml-2 text-[10px] font-bold tracking-wider bg-emerald-950/80 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800/60 uppercase">Cumberland Engine</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="alert('Submission form opens')" class="text-xs font-bold font-display tracking-wide bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-500 hover:to-sky-400 text-white px-3.5 py-2 rounded-xl transition shadow-lg shadow-brand-600/20 active:scale-95 whitespace-nowrap">
                    + Add Spot
                </button>
            </div>
        </div>
    </header>

    <!-- HERO & AREA SELECTOR -->
    <section class="relative bg-slate-950 pt-6 pb-8 border-b border-slate-800/80 overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-48 bg-gradient-to-r from-brand-600/10 via-sky-500/10 to-emerald-500/10 blur-3xl pointer-events-none"></div>

        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 text-center">
            
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-sky-400 text-xs font-semibold mb-4 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Live Regional Discovery Across Cumberland
            </div>

            <h1 class="text-2xl sm:text-4xl font-display font-extrabold text-white tracking-tight max-w-3xl mx-auto leading-tight">
                Discover Independent Spots, Cafés & <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-teal-300 to-emerald-400">Community Events.</span>
            </h1>

            <!-- SEARCH BAR COMPONENT -->
            <div class="mt-5 max-w-xl mx-auto relative">
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400 text-sm">🔍</span>
                    <input 
                        type="text" 
                        id="search-input" 
                        oninput="handleSearch()"
                        placeholder="Search 'coffee', 'rain', 'kids', 'umbrella', 'bake'..." 
                        class="w-full bg-slate-900/90 border border-slate-800 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-slate-100 text-xs sm:text-sm rounded-2xl pl-10 pr-10 py-3 outline-none transition shadow-inner placeholder:text-slate-500"
                    />
                    <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-4 text-slate-400 hover:text-white text-xs font-bold">✕</button>
                </div>
            </div>

            <!-- FIXED MULTI-TOWN SELECTOR (NO LONGER CLIPPED) -->
            <div class="mt-6 flex items-center justify-start sm:justify-center gap-2 overflow-x-auto no-scrollbar py-1 px-2">
                <span class="text-xs font-bold text-slate-400 mr-1 uppercase tracking-wider shrink-0">Area:</span>
                <button onclick="selectTown('carlisle')" id="town-carlisle" class="shrink-0 px-4 py-2 rounded-xl text-xs font-display font-bold bg-brand-600 text-white border border-brand-500 transition shadow-lg shadow-brand-600/20">Carlisle</button>
                <button onclick="selectTown('keswick')" id="town-keswick" class="shrink-0 px-4 py-2 rounded-xl text-xs font-display font-bold bg-slate-900 text-slate-400 border border-slate-800 hover:text-white transition">Keswick</button>
                <button onclick="selectTown('penrith')" id="town-penrith" class="shrink-0 px-4 py-2 rounded-xl text-xs font-display font-bold bg-slate-900 text-slate-400 border border-slate-800 hover:text-white transition">Penrith</button>
                <button onclick="selectTown('whitehaven')" id="town-whitehaven" class="shrink-0 px-4 py-2 rounded-xl text-xs font-display font-bold bg-slate-900 text-slate-400 border border-slate-800 hover:text-white transition">Whitehaven</button>
                <button onclick="selectTown('workington')" id="town-workington" class="shrink-0 px-4 py-2 rounded-xl text-xs font-display font-bold bg-slate-900 text-slate-400 border border-slate-800 hover:text-white transition">Workington</button>
            </div>
        </div>
    </section>

    <!-- DASHBOARD CONTENT -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">

        <!-- VIEW TOGGLES & FILTERS -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 mb-8">
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="filterCategory('all')" id="cat-all" class="px-4 py-2 rounded-xl text-xs font-display font-bold bg-brand-600 text-white whitespace-nowrap shadow-md">🌟 All Spots</button>
                <button onclick="filterCategory('cafes')" id="cat-cafes" class="px-4 py-2 rounded-xl text-xs font-display font-bold bg-slate-900 text-slate-300 border border-slate-800 hover:text-white whitespace-nowrap">☕ Cafés & Bakes</button>
                <button onclick="filterCategory('play')" id="cat-play" class="px-4 py-2 rounded-xl text-xs font-display font-bold bg-slate-900 text-slate-300 border border-slate-800 hover:text-white whitespace-nowrap">🧸 Kids & Family</button>
                <button onclick="filterCategory('events')" id="cat-events" class="px-4 py-2 rounded-xl text-xs font-display font-bold bg-slate-900 text-slate-300 border border-slate-800 hover:text-white whitespace-nowrap">🎟️ Events & Passes</button>
            </div>

            <div class="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-800/80 self-end sm:self-auto shrink-0">
                <button onclick="toggleView('list')" id="view-btn-list" class="px-3.5 py-1.5 rounded-lg text-xs font-display font-bold bg-slate-800 text-white transition">📋 List</button>
                <button onclick="toggleView('map')" id="view-btn-map" class="px-3.5 py-1.5 rounded-lg text-xs font-display font-bold text-slate-400 hover:text-white transition">🗺️ Map View</button>
            </div>
        </div>

        <!-- MAP WRAPPER -->
        <div id="map-wrapper" class="hidden mb-8">
            <div class="bg-slate-900 p-2 rounded-2xl border border-slate-800 shadow-2xl">
                <div id="map-container"></div>
            </div>
        </div>

        <!-- LISTINGS CONTAINER -->
        <div id="list-wrapper" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

    </main>

    <!-- APPLICATION ENGINE -->
    <script>
        const townData = {
            carlisle: {
                name: "Carlisle",
                lat: 54.891, lng: -2.932,
                items: [
                    {
                        id: 1,
                        title: "Castle Street Bakehouse",
                        logo: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=100&auto=format&fit=crop&q=80",
                        image: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600&auto=format&fit=crop&q=80",
                        category: "cafes",
                        tags: ["coffee", "bakery", "sourdough", "cake", "cinnamon buns", "indoor"],
                        isFeatured: true,
                        location: "Historic Quarter, Carlisle",
                        desc: "Specialty Cumbrian roasted coffee, artisan sourdough, and fresh daily traybakes.",
                        socialUpdate: "🥐 Fresh sourdough loaves & cinnamon buns just out of the oven!",
                        socialImage: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500&auto=format&fit=crop&q=80",
                        socialTime: "1 hour ago via Instagram",
                        lat: 54.896, lng: -2.938,
                        isTicketed: false
                    },
                    {
                        id: 2,
                        title: "Bruce & Luke's Coffee Hub",
                        logo: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=100&auto=format&fit=crop&q=80",
                        image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600&auto=format&fit=crop&q=80",
                        category: "cafes",
                        tags: ["coffee", "espresso", "donuts", "takeaway", "drinks"],
                        isFeatured: true,
                        location: "Devonshire Street, Carlisle",
                        desc: "Famous local coffee roasters serving espresso shots, iced lattes, and artisan donuts.",
                        socialUpdate: "☕ New single-origin Ethiopian beans on espresso today!",
                        socialImage: "https://images.unsplash.com/photo-1511920170033-f8396924c348?w=500&auto=format&fit=crop&q=80",
                        socialTime: "3 hours ago via Instagram",
                        lat: 54.892, lng: -2.932,
                        isTicketed: false
                    },
                    {
                        id: 3,
                        title: "Kids Clay & Pottery Workshop",
                        logo: "https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=100&auto=format&fit=crop&q=80",
                        image: "https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=600&auto=format&fit=crop&q=80",
                        category: "play",
                        tags: ["kids", "pottery", "crafts", "family", "indoor", "rain", "umbrella"],
                        isFeatured: false,
                        location: "Abbey Street Hub, Carlisle",
                        desc: "Guided 45-minute indoor clay crafting session designed for children and young families.",
                        socialUpdate: null,
                        socialImage: null,
                        lat: 54.894, lng: -2.936,
                        isTicketed: true,
                        price: 6.00,
                        date: "Saturday • 10:30 AM"
                    }
                ]
            },
            keswick: {
                name: "Keswick",
                lat: 54.601, lng: -3.135,
                items: [
                    {
                        id: 5,
                        title: "Kat's Kitchen",
                        logo: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=100&auto=format&fit=crop&q=80",
                        image: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=600&auto=format&fit=crop&q=80",
                        category: "cafes",
                        tags: ["coffee", "vegan", "cake", "lunch", "indoor", "rain"],
                        isFeatured: true,
                        location: "Lake Road, Keswick",
                        desc: "Cozy riverside plant-based café serving fresh cakes, soups, and fairtrade coffee.",
                        socialUpdate: "🍲 Warm up out of the rain with our homemade lentil & coriander soup!",
                        socialImage: "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=500&auto=format&fit=crop&q=80",
                        socialTime: "40 mins ago via Facebook",
                        lat: 54.599, lng: -3.136,
                        isTicketed: false
                    }
                ]
            },
            penrith: { name: "Penrith", lat: 54.664, lng: -2.753, items: [] },
            whitehaven: { name: "Whitehaven", lat: 54.548, lng: -3.587, items: [] },
            workington: { name: "Workington", lat: 54.643, lng: -3.543, items: [] }
        };

        let currentTown = 'carlisle';
        let currentCategory = 'all';
        let currentSearchQuery = '';
        let currentView = 'list';
        let map = null;
        let mapMarkers = [];

        function render() {
            const listContainer = document.getElementById('list-wrapper');
            listContainer.innerHTML = '';

            const items = townData[currentTown].items.filter(item => {
                const categoryMatches = (currentCategory === 'all') ||
                                        (currentCategory === 'events' && item.isTicketed) ||
                                        (item.category === currentCategory);

                const query = currentSearchQuery.toLowerCase().trim();
                const searchMatches = !query || 
                    item.title.toLowerCase().includes(query) ||
                    item.desc.toLowerCase().includes(query) ||
                    item.location.toLowerCase().includes(query) ||
                    (item.tags && item.tags.some(tag => tag.toLowerCase().includes(query)));

                return categoryMatches && searchMatches;
            });

            if (items.length === 0) {
                const emptyMsg = currentSearchQuery 
                    ? `No results matching "${currentSearchQuery}" in ${townData[currentTown].name}.`
                    : `No active spots listed in ${townData[currentTown].name} for this category yet.`;
                listContainer.innerHTML = `<div class="col-span-3 py-16 text-center text-slate-500 font-medium text-xs">${emptyMsg}</div>`;
                return;
            }

            items.forEach(item => {
                listContainer.innerHTML += `
                    <div class="bg-slate-900/90 border ${item.isFeatured ? 'border-sky-500/40 ring-1 ring-sky-500/20' : 'border-slate-800/80'} rounded-2xl overflow-hidden flex flex-col justify-between shadow-xl transition hover:border-slate-700">
                        
                        <!-- CARD HERO IMAGE -->
                        <div class="relative h-44 w-full overflow-hidden bg-slate-950">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover transition hover:scale-105 duration-500" />
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>
                            
                            <div class="absolute top-3 left-3 right-3 flex items-center justify-between">
                                ${item.isFeatured ? '<span class="text-[9px] font-display font-bold px-2.5 py-1 rounded-full bg-slate-950/90 backdrop-blur-md text-sky-400 border border-sky-500/30 tracking-wider">FEATURED</span>' : '<span class="text-[9px] font-display font-bold px-2.5 py-1 rounded-full bg-slate-950/90 backdrop-blur-md text-slate-300 border border-slate-800">INDEPENDENT</span>'}
                                <button onclick="openDirections(${item.lat}, ${item.lng}, '${item.title}')" class="text-[10px] font-bold bg-slate-950/80 backdrop-blur-md px-2.5 py-1 rounded-full text-sky-400 hover:text-white transition border border-slate-800">📍 Route →</button>
                            </div>
                        </div>

                        <!-- CARD BODY -->
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center gap-3 mb-2">
                                    <img src="${item.logo}" alt="${item.title} Logo" class="w-8 h-8 rounded-full border border-slate-700 object-cover shadow-md" />
                                    <div>
                                        <h3 class="font-display font-bold text-white text-base tracking-tight leading-snug">${item.title}</h3>
                                        <p class="text-[11px] font-medium text-slate-400">${item.location}</p>
                                    </div>
                                </div>

                                <p class="text-xs text-slate-300 mt-2 leading-relaxed">${item.desc}</p>

                                ${item.socialUpdate ? `
                                    <div class="mt-4 p-3 rounded-xl bg-slate-950 border border-sky-500/20 relative overflow-hidden">
                                        <div class="flex items-center gap-1.5 mb-2">
                                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                            <span class="text-[9px] font-mono font-bold text-sky-400 uppercase tracking-wider">LIVE INSTAGRAM FEED</span>
                                        </div>
                                        
                                        ${item.socialImage ? `
                                            <div class="mb-2.5 h-32 w-full rounded-lg overflow-hidden border border-slate-800">
                                                <img src="${item.socialImage}" alt="Feed Post" class="w-full h-full object-cover" />
                                            </div>
                                        ` : ''}

                                        <p class="text-xs text-slate-200 font-medium leading-normal">"${item.socialUpdate}"</p>
                                        <span class="text-[9px] text-slate-500 font-mono mt-1.5 block">${item.socialTime}</span>
                                    </div>
                                ` : ''}
